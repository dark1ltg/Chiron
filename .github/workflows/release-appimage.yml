name: Release AppImage

on:
  push:
    tags:
      - 'v*'
      - 'chiron-*'
    branches:
      - main
    paths:
      - '.github/release-request'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix (e.g. 0.2.4)'
        required: true
        default: '0.2.4'

permissions:
  contents: write

env:
  TOOLS_URL: https://github.com/mmatyas/pegasus-frontend/releases/download/alpha1
  QT_TARGET: x11-static
  QT_VERSION: qt51512
  SDL_TARGET: x11-jammy
  SDL_VERSION: "2.32.10"

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ -f .github/release-request ]]; then
            VERSION="$(tr -d '[:space:]' < .github/release-request)"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION="${VERSION#chiron-}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
          fi
          if [[ -z "${VERSION}" ]]; then
            echo "Could not resolve release version" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version ${VERSION}"

      - name: APT deps
        run: |
          sudo apt-get update
          # libunwind-dev first — gstreamer pulls it and can fail on unmet deps otherwise
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y \
            g++ ninja-build curl ca-certificates file desktop-file-utils libfuse2 \
            libasound2-dev libgl1-mesa-dev libgstreamer-plugins-base1.0-dev \
            libpulse-dev libudev-dev \
            libfontconfig1-dev libfreetype-dev libharfbuzz-dev \
            libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev libxcb-sync-dev \
            libxcb-util-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
            libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev \
            libx11-dev libxext-dev libxrender-dev libdbus-1-dev libssl-dev \
            libjpeg-dev libpng-dev libicu-dev libinput-dev

      - name: Build AppImage
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/build-appimage.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chiron-x86_64-AppImage
          path: dist/Chiron-*.AppImage

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Chiron ${{ steps.ver.outputs.version }}
          body_path: .github/release-notes.md
          files: |
            dist/Chiron-*-x86_64.AppImage
          fail_on_unmatched_files: true
          make_latest: true
